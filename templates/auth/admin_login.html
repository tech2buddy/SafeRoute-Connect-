{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Sign In | SafeRoute Connect</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/password-recovery.css' %}">
</head>
<body>
    <main class="recovery-shell">
        <a class="recovery-brand" href="/">SafeRoute <span>Admin</span></a>
        <section class="recovery-card">
            <span class="recovery-kicker">RESTRICTED WORKSPACE</span>
            <h1>Admin sign in.</h1>
            <p>Use the email and password of an approved administrator. A normal user account cannot access admin data.</p>
            <form id="admin-login-form" method="post">
                {% csrf_token %}
                <label for="admin-email">Admin email</label>
                <input id="admin-email" name="email" type="email" autocomplete="username" placeholder="admin@example.com" required>

                <label for="admin-password">Password</label>
                <input id="admin-password" name="password" type="password" autocomplete="current-password" placeholder="••••••••••••" required>

                <button type="submit" id="admin-submit-btn">Sign in to admin</button>
                <p id="admin-login-status" role="status" aria-live="polite"></p>
            </form>
            <div style="display:flex; justify-content:space-between; margin-top:20px; align-items:center;">
                <a href="{% url 'forgot_password' %}">Forgot password?</a>
                <a class="recovery-back" style="margin-top:0;" href="{% url 'routes' %}">Back to website &rarr;</a>
            </div>
        </section>
    </main>
    <script type="module" src="{% static 'js/admin-login.js' %}"></script>
</body>
</html>
